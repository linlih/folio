# Installers for desktop and phones. Run it from the Actions tab ("Run
# workflow"), or push a tag like v0.1.0 to also make a draft release.
# Builds are kept as artifacts of the run for 14 days.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci
      # The body fonts are fetched, not committed (OFL, about 26 MB).
      - name: Fonts
        shell: bash
        run: ./scripts/fetch-fonts.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Folio ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Fonts
        run: ./scripts/fetch-fonts.sh
      # The Android project is generated here (src-tauri/gen/android is not
      # committed until it needs changes of its own, M4).
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --ci
      # Signed with the project's own key (repository secrets), so a new
      # build installs over the last one. Without the secrets the APK stays
      # unsigned and cannot be installed.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "built: $apk"
          mkdir -p out
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key in the repository secrets; the APK is unsigned."
            cp "$apk" out/folio-android-arm64-unsigned.apk
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/folio.p12"
          "$tools/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/folio.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias folio --out out/folio-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify out/folio-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: folio-Android
          retention-days: 14
          if-no-files-found: error
          path: out/*.apk

  # Installing on an iPhone needs an Apple developer account and signing
  # (design/ARCHITECTURE.md §7.2); until then this checks that the app
  # builds for iOS and the simulator.
  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: cargo build --release --lib -p folio --target aarch64-apple-ios
      - run: cargo build --release --lib -p folio --target aarch64-apple-ios-sim
