# Installers for desktop and phones. Run it from the Actions tab ("Run
# workflow") to get them as artifacts of the run (kept 14 days), or push a
# tag like v0.1.0 (scripts/release.sh) to publish a release: the installers,
# the Android APK and latest.json, which installed apps check for updates
# (design/ARCHITECTURE.md §7.3).
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # A tag makes the release first, with the tag's message as its notes, so
  # every build below adds its files to the same one.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: notes
        run: |
          git fetch --force --tags
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          { echo "notes<<END_OF_NOTES"; echo "$notes"; echo "END_OF_NOTES"; } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Folio $GITHUB_REF_NAME" --notes-from-tag --verify-tag

  desktop:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci
      # The body fonts are fetched, not committed (OFL, about 26 MB).
      - name: Fonts
        shell: bash
        run: ./scripts/fetch-fonts.sh
      # Signs the update packages (the apps check that signature before
      # installing) and, for a tag, adds them and latest.json to the release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Folio ${{ github.ref_name }}
          releaseBody: ${{ needs.release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage

  android:
    name: Android (APK)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Fonts
        run: ./scripts/fetch-fonts.sh
      # The Android project is generated here (src-tauri/gen/android is not
      # committed until it needs changes of its own, M4).
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --ci
      # Signed with the project's own key (repository secrets), so a new
      # build installs over the last one. Without the secrets the APK stays
      # unsigned and cannot be installed.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "built: $apk"
          mkdir -p out
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key in the repository secrets; the APK is unsigned."
            cp "$apk" out/folio-android-arm64-unsigned.apk
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/folio.p12"
          "$tools/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/folio.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias folio --out out/folio-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify out/folio-android-arm64.apk
      # Under a fixed name, so releases/latest/download/folio-android-arm64.apk
      # is always the newest (the Android app opens it to update).
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/folio-android-arm64.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: folio-Android
          retention-days: 14
          if-no-files-found: error
          path: out/*.apk

  # Installing on an iPhone needs an Apple developer account and signing
  # (design/ARCHITECTURE.md §7.2); until then this checks that the app
  # builds for iOS and the simulator.
  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: cargo build --release --lib -p folio --target aarch64-apple-ios
      - run: cargo build --release --lib -p folio --target aarch64-apple-ios-sim
