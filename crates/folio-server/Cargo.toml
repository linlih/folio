[package]
name = "folio-server"
description = "Sync relay: stores encrypted update logs per workspace and hands them out by cursor (M3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
folio-sync = { path = "../folio-sync" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
folio-core.workspace = true
folio-store.workspace = true
loro.workspace = true
