<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>图标预览 v6</title><style>
  body { margin: 0; font: 14px -apple-system, "PingFang SC", sans-serif; color: #37352f; background: #fdfaf6; }
  .row { display: flex; gap: 24px; padding: 24px 32px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { display: block; border-radius: 22.37%; }
  .big img { width: 140px; height: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .sizes { display: flex; gap: 8px; align-items: center; }
  .s64 { width: 64px; height: 64px; } .sizes{width:140px;flex-direction:row;justify-content:center} .s32 { width: 32px; height: 32px; } .s16 { width: 16px; height: 16px; }
  .dock { margin: 8px 48px 32px; padding: 14px 20px; border-radius: 28px; display: inline-flex; gap: 14px; }
  .dock img { width: 64px; height: 64px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .light { background: linear-gradient(135deg, #c9d6e8, #e9d9c9); }
  .dark { background: linear-gradient(135deg, #1d2433, #2b2320); }
  .label { color: #6b675f; }
</style></head><body style="width:1260px"><div class="row big"><div class="col"><img src="a-original.svg"><span class="label">a 原版</span></div><div class="col"><img src="b-larger-soft.svg"><span class="label">b 原版放大 + 极淡渐变</span></div><div class="col"><img src="c-ink-ground.svg"><span class="label">c 墨蓝底</span></div><div class="col"><img src="d-dark.svg"><span class="label">d 深色模式</span></div><div class="col"><img src="e-midrib-gap.svg"><span class="label">e 中脉留白</span></div><div class="col"><img src="f-sky-ground.svg"><span class="label">f 浅蓝底</span></div></div><div class="row"><div class="col sizes"><img class="s64" src="a-original.svg"><img class="s32" src="a-original.svg"><img class="s16" src="a-original.svg"></div><div class="col sizes"><img class="s64" src="b-larger-soft.svg"><img class="s32" src="b-larger-soft.svg"><img class="s16" src="b-larger-soft.svg"></div><div class="col sizes"><img class="s64" src="c-ink-ground.svg"><img class="s32" src="c-ink-ground.svg"><img class="s16" src="c-ink-ground.svg"></div><div class="col sizes"><img class="s64" src="d-dark.svg"><img class="s32" src="d-dark.svg"><img class="s16" src="d-dark.svg"></div><div class="col sizes"><img class="s64" src="e-midrib-gap.svg"><img class="s32" src="e-midrib-gap.svg"><img class="s16" src="e-midrib-gap.svg"></div><div class="col sizes"><img class="s64" src="f-sky-ground.svg"><img class="s32" src="f-sky-ground.svg"><img class="s16" src="f-sky-ground.svg"></div></div><div class="dock light"><img src="a-original.svg"><img src="b-larger-soft.svg"><img src="c-ink-ground.svg"><img src="d-dark.svg"><img src="e-midrib-gap.svg"><img src="f-sky-ground.svg"></div><br><div class="dock dark"><img src="a-original.svg"><img src="b-larger-soft.svg"><img src="c-ink-ground.svg"><img src="d-dark.svg"><img src="e-midrib-gap.svg"><img src="f-sky-ground.svg"></div></body></html>
