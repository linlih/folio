<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图标预览 v3</title>
<style>
  body { margin: 0; font: 14px -apple-system, "PingFang SC", sans-serif; color: #37352f; background: #fdfaf6; }
  .row { display: flex; gap: 48px; padding: 32px 48px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { display: block; border-radius: 22.37%; }
  .big img { width: 180px; height: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .sizes { display: flex; gap: 14px; align-items: center; }
  .s64 { width: 64px; height: 64px; } .s32 { width: 32px; height: 32px; } .s16 { width: 16px; height: 16px; }
  .dock { margin: 8px 48px 32px; padding: 14px 20px; border-radius: 28px; display: inline-flex; gap: 14px; }
  .dock img { width: 64px; height: 64px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .light { background: linear-gradient(135deg, #c9d6e8, #e9d9c9); }
  .dark { background: linear-gradient(135deg, #1d2433, #2b2320); }
  .label { color: #6b675f; }
</style>
</head>
<body>
  <div class="row big">
    <div class="col"><img src="a-index-cards.svg"><span class="label">A 索引卡</span></div>
    <div class="col"><img src="b-bookmark-card.svg"><span class="label">B 书签卡</span></div>
    <div class="col"><img src="c-pinned-card.svg"><span class="label">C 钉在白板</span></div>
    <div class="col"><img src="d-seal.svg"><span class="label">D 页字印章</span></div>
  </div>
  <div class="row">
    <div class="col sizes"><img class="s64" src="a-index-cards.svg"><img class="s32" src="a-index-cards.svg"><img class="s16" src="a-index-cards.svg"></div>
    <div class="col sizes"><img class="s64" src="b-bookmark-card.svg"><img class="s32" src="b-bookmark-card.svg"><img class="s16" src="b-bookmark-card.svg"></div>
    <div class="col sizes"><img class="s64" src="c-pinned-card.svg"><img class="s32" src="c-pinned-card.svg"><img class="s16" src="c-pinned-card.svg"></div>
    <div class="col sizes"><img class="s64" src="d-seal.svg"><img class="s32" src="d-seal.svg"><img class="s16" src="d-seal.svg"></div>
  </div>
  <div class="dock light"><img src="a-index-cards.svg"><img src="b-bookmark-card.svg"><img src="c-pinned-card.svg"><img src="d-seal.svg"></div>
  <div class="dock dark"><img src="a-index-cards.svg"><img src="b-bookmark-card.svg"><img src="c-pinned-card.svg"><img src="d-seal.svg"></div>
</body>
</html>
