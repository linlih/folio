<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>图标定稿</title><style>
body{margin:0;width:1180px;padding:24px 32px;font:14px -apple-system,"PingFang SC";color:#37352f;background:#fdfaf6}
.row{display:flex;gap:28px;align-items:flex-end;margin-bottom:28px}.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.l{color:#6b675f;font-size:13px}.m{border-radius:22.37%}.r{border-radius:50%}
.dock{padding:14px 20px;border-radius:26px;display:inline-flex;gap:16px;align-items:center;margin-right:16px}
.light{background:linear-gradient(135deg,#c9d6e8,#e9d9c9)}.dark{background:linear-gradient(135deg,#1d2433,#2b2320)}
</style></head><body>
<div class="row">
<div class="c"><img class="m" src="icon.svg" width="150"><span class="l">默认（iOS / App Store）</span></div>
<div class="c"><img class="m" src="icon-dark.svg" width="150"><span class="l">深色外观</span></div>
<div class="c"><img class="m" style="background:#e9eef5" src="icon-mono.svg" width="150"><span class="l">单色（着色 / 主题图标）</span></div>
<div class="c"><img src="../../../src-tauri/icons/icon.png" width="170"><span class="l">桌面版（macOS / Windows）</span></div>
<div class="c"><img class="r" src="../../../src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher_round.png" width="150"><span class="l">Android 圆形遮罩</span></div>
</div>
<div class="row">
<div class="c"><div style="display:flex;gap:14px;align-items:center"><img class="m" src="icon.svg" width="32"><img class="m" src="icon.svg" width="16"></div><span class="l">原图缩小 32 / 16</span></div>
<div class="c"><div style="display:flex;gap:14px;align-items:center"><img class="m" src="icon-small.svg" width="32"><img class="m" src="icon-small.svg" width="16"><img class="m" src="icon-small-dark.svg" width="32"><img class="m" src="icon-small-dark.svg" width="16"></div><span class="l">小尺寸版 32 / 16（浅 / 深）</span></div>
<div class="c"><div style="display:flex;gap:14px;align-items:center"><img src="../../../src-tauri/icons/32x32.png" width="32"><img src="../../../src-tauri/icons/icon.png" width="64"></div><span class="l">项目内实际文件 32px / 64px</span></div>
</div>
<div class="dock light"><img src="../../../src-tauri/icons/icon.png" width="76"><img class="m" src="icon.svg" width="60"></div><div class="dock dark"><img src="../../../src-tauri/icons/icon.png" width="76"><img class="m" src="icon-dark.svg" width="60"></div>
</body></html>
