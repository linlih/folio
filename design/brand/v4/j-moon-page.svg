<rect x="200" y="460" width="440" height="340" rx="48" fill="url(#card)" stroke="#8cb4de" stroke-opacity="0.55" stroke-width="5"/>
<rect x="268" y="552" width="200" height="22" rx="11" fill="#f3dfb4"/>
<rect x="268" y="620" width="300" height="14" rx="7" fill="#8cb4de" fill-opacity="0.6"/>
