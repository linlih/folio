<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>图标预览 v5</title><style>
  body { margin: 0; font: 14px -apple-system, "PingFang SC", sans-serif; color: #37352f; background: #fdfaf6; }
  .row { display: flex; gap: 24px; padding: 24px 32px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { display: block; border-radius: 22.37%; }
  .big img { width: 140px; height: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .sizes { display: flex; gap: 8px; align-items: center; }
  .s64 { width: 64px; height: 64px; } .sizes{width:140px;flex-direction:row;justify-content:center} .s32 { width: 32px; height: 32px; } .s16 { width: 16px; height: 16px; }
  .dock { margin: 8px 48px 32px; padding: 14px 20px; border-radius: 28px; display: inline-flex; gap: 14px; }
  .dock img { width: 64px; height: 64px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .light { background: linear-gradient(135deg, #c9d6e8, #e9d9c9); }
  .dark { background: linear-gradient(135deg, #1d2433, #2b2320); }
  .label { color: #6b675f; }
</style></head><body style="width:1260px"><div class="row big"><div class="col"><img src="1-ink-leaf.svg"><span class="label">1 墨叶（D）</span></div><div class="col"><img src="2-crystal-leaf.svg"><span class="label">2 晶叶（E）</span></div><div class="col"><img src="3-paper-leaf.svg"><span class="label">3 纸叶（A）</span></div><div class="col"><img src="4-pages-leaf.svg"><span class="label">4 书页叶</span></div><div class="col"><img src="5-dawn-leaf.svg"><span class="label">5 晨光叶（A）</span></div><div class="col"><img src="6-glass-leaves.svg"><span class="label">6 双叶（E）</span></div></div><div class="row"><div class="col sizes"><img class="s64" src="1-ink-leaf.svg"><img class="s32" src="1-ink-leaf.svg"><img class="s16" src="1-ink-leaf.svg"></div><div class="col sizes"><img class="s64" src="2-crystal-leaf.svg"><img class="s32" src="2-crystal-leaf.svg"><img class="s16" src="2-crystal-leaf.svg"></div><div class="col sizes"><img class="s64" src="3-paper-leaf.svg"><img class="s32" src="3-paper-leaf.svg"><img class="s16" src="3-paper-leaf.svg"></div><div class="col sizes"><img class="s64" src="4-pages-leaf.svg"><img class="s32" src="4-pages-leaf.svg"><img class="s16" src="4-pages-leaf.svg"></div><div class="col sizes"><img class="s64" src="5-dawn-leaf.svg"><img class="s32" src="5-dawn-leaf.svg"><img class="s16" src="5-dawn-leaf.svg"></div><div class="col sizes"><img class="s64" src="6-glass-leaves.svg"><img class="s32" src="6-glass-leaves.svg"><img class="s16" src="6-glass-leaves.svg"></div></div><div class="dock light"><img src="1-ink-leaf.svg"><img src="2-crystal-leaf.svg"><img src="3-paper-leaf.svg"><img src="4-pages-leaf.svg"><img src="5-dawn-leaf.svg"><img src="6-glass-leaves.svg"></div><br><div class="dock dark"><img src="1-ink-leaf.svg"><img src="2-crystal-leaf.svg"><img src="3-paper-leaf.svg"><img src="4-pages-leaf.svg"><img src="5-dawn-leaf.svg"><img src="6-glass-leaves.svg"></div></body></html>
